<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Abrindo oferta...</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:Arial,sans-serif;background:#f7f9fc;color:#101828}.box{max-width:480px;text-align:center;background:#fff;padding:36px;border-radius:24px;border:1px solid #e4e7ec}</style></head><body><main class="box"><h1>Abrindo a oferta...</h1><p id="status">Buscando o produto.</p><a id="manual" href="/" rel="nofollow sponsored">Voltar</a></main><script src="/assets/js/products.js"></script><script>const slug=location.pathname.split('/').filter(Boolean).pop();const p=(AE_PRODUCTS||[]).find(x=>x.slug===slug);if(p){manual.href=p.affiliateUrl;manual.textContent='Abrir agora →';status.textContent='Você será direcionado para a loja parceira.';setTimeout(()=>location.replace(p.affiliateUrl),500)}else{document.querySelector('h1').textContent='Produto não encontrado';status.textContent='Volte aos achados.'}</script></body></html>
